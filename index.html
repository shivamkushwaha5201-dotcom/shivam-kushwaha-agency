        try {
          var origFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var currentFetch = origFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(val) {
              currentFetch = typeof val === 'function' ? val : origFetch;

            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // Safe fallback
        }
      })();
