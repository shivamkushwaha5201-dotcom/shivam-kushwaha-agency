          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(val) {
              currentFetch = typeof val === 'function' ? val : origFetch;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // Safe fallback
        }
      })();

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <!-- Hero Cat & Floating Platform Keyframe Animations -->
    <style id="hero-floating-animations">
      /* 1. Product Hunt Float */
      @keyframes heroFloatPH {
        0%, 100% {
          transform: translateY(0px) translateX(0px) rotate(-6deg);
          filter: blur(0px);
        }
        25% {
          filter: blur(0.4px);
        }
        50% {
          transform: translateY(-12px) translateX(4px) rotate(-3.5deg);
          filter: blur(0px);
        }
        75% {
          filter: blur(0.4px);
        }
      }
      @keyframes heroFloatLabelPH {
        0%, 100% {
          transform: translateY(0px) translateX(0px) rotate(0deg);
        }
        50% {
          transform: translateY(-8px) translateX(-3px) rotate(1.5deg);
        }
      }
      .hero-ph-tile {
        animation: heroFloatPH 5.0s ease-in-out infinite 0s !important;
        will-change: transform, filter;
      }
      .hero-ph-label {
        animation: heroFloatLabelPH 5.8s ease-in-out infinite 0.4s !important;
        will-change: transform;
      }

      /* 2. X (Twitter) Float */
      @keyframes heroFloatX {
        0%, 100% {
          transform: translateY(0px) translateX(0px) rotate(6deg);
          filter: blur(0px);
        }
        25% {
          filter: blur(0.4px);
        }
        50% {
          transform: translateY(-13px) translateX(-4px) rotate(3.5deg);
          filter: blur(0px);
        }
        75% {
          filter: blur(0.4px);
        }
      }
      @keyframes heroFloatLabelX {
        0%, 100% {
          transform: translateY(0px) translateX(0px) rotate(0deg);
        }
        50% {
          transform: translateY(-8px) translateX(3px) rotate(-1.5deg);
        }
      }
      .hero-x-tile {
        animation: heroFloatX 5.4s ease-in-out infinite 0.9s !important;
        will-change: transform, filter;
      }
      .hero-x-label {
        animation: heroFloatLabelX 6.2s ease-in-out infinite 0.2s !important;
        will-change: transform;
      }

      /* 3. LinkedIn Float */
      @keyframes heroFloatLI {
        0%, 100% {
          transform: translateY(0px) translateX(0px) rotate(-6deg);
          filter: blur(0px);
        }
        25% {
          filter: blur(0.4px);
        }
        50% {
          transform: translateY(-11px) translateX(5px) rotate(-3.5deg);
          filter: blur(0px);
        }
        75% {
          filter: blur(0.4px);
        }
      }
      @keyframes heroFloatLabelLI {
        0%, 100% {
          transform: translateY(0px) translateX(0px) rotate(0deg);
        }
        50% {
          transform: translateY(-7px) translateX(-3px) rotate(1.2deg);
        }
      }
      .hero-li-tile {
        animation: heroFloatLI 5.8s ease-in-out infinite 1.5s !important;
        will-change: transform, filter;
      }
      .hero-li-label {
        animation: heroFloatLabelLI 5.2s ease-in-out infinite 0.7s !important;
        will-change: transform;
      }

      /* 4. Reddit Float */
      @keyframes heroFloatReddit {
        0%, 100% {
          transform: translateY(0px) translateX(0px) rotate(6deg);
          filter: blur(0px);
        }
        25% {
          filter: blur(0.4px);
        }
        50% {
          transform: translateY(-13px) translateX(-5px) rotate(3.5deg);
          filter: blur(0px);
        }
        75% {
          filter: blur(0.4px);
        }
      }
      @keyframes heroFloatLabelReddit {
        0%, 100% {
          transform: translateY(0px) translateX(0px) rotate(0deg);
        }
        50% {
          transform: translateY(-9px) translateX(4px) rotate(-1.4deg);
        }
      }
      .hero-reddit-tile {
        animation: heroFloatReddit 4.6s ease-in-out infinite 0.5s !important;
        will-change: transform, filter;
      }
      .hero-reddit-label {
        animation: heroFloatLabelReddit 5.6s ease-in-out infinite 1.1s !important;
        will-change: transform;
      }

      /* 5. Enhanced Mint Ambient Glow Pulsing */
      @keyframes heroMintGlowPulse {
        0%, 100% {
          transform: scale(0.96);
          opacity: 0.65;
        }
        50% {
          transform: scale(1.12);
          opacity: 0.95;
        }
      }
      .hero-mint-glow {
        animation: heroMintGlowPulse 5.4s ease-in-out infinite !important;
        will-change: transform;
      }

      @keyframes heroMintAuraBreathe {
        0%, 100% {
          transform: scale(1) translateY(0px);
          opacity: 0.5;
        }
        50% {
          transform: scale(1.18) translateY(-6px);
          opacity: 0.8;
        }
      }
      .hero-mint-aura {
        animation: heroMintAuraBreathe 7.2s ease-in-out infinite 0.8s !important;
        will-change: transform;
      }

      /* 6. Flowing Curved Green Waves */
      @keyframes heroWaveFlow1 {
        0%, 100% {
          transform: translateY(0px) translateX(0px) scaleY(1);
          opacity: 0.55;
        }
        50% {
          transform: translateY(-8px) translateX(-10px) scaleY(1.08);
          opacity: 0.8;
        }
      }
      .hero-wave-layer-1 {
        animation: heroWaveFlow1 6.8s ease-in-out infinite !important;
        transform-origin: center;
        will-change: transform;
      }

      @keyframes heroWaveFlow2 {
        0%, 100% {
          transform: translateY(0px) translateX(0px) scaleY(1);
          opacity: 0.45;
        }
        50% {
          transform: translateY(6px) translateX(12px) scaleY(0.94);
          opacity: 0.72;
        }
      }
      .hero-wave-layer-2 {
        animation: heroWaveFlow2 7.6s ease-in-out infinite 0.7s !important;
        transform-origin: center;
        will-change: transform;
      }

      /* 7. SVG Dotted Connectors */
      @keyframes heroDottedLineFlow {
        0% {
          stroke-dashoffset: 0;
          opacity: 0.45;
        }
        50% {
          opacity: 0.85;
        }
        100% {
          stroke-dashoffset: -28;
          opacity: 0.45;
        }
      }
      .hero-dotted-line {
        animation: heroDottedLineFlow 4.8s linear infinite !important;
        will-change: transform, stroke-dashoffset;
      }
      .hero-line-ph { animation-delay: 0s !important; }
      .hero-line-x { animation-delay: 1.2s !important; }
      .hero-line-li { animation-delay: 2.2s !important; }
      .hero-line-reddit { animation-delay: 0.6s !important; }

      /* 8. Growth Arrow */
      @keyframes heroGrowthArrowFloat {
        0%, 100% {
          transform: translateY(0px) translateX(0px) scale(1);
          opacity: 0.75;
        }
        50% {
          transform: translateY(-7px) translateX(3px) scale(1.1);
          opacity: 1;
        }
      }
      .hero-growth-arrow {
        animation: heroGrowthArrowFloat 4.4s ease-in-out infinite 0.4s !important;
        transform-box: fill-box;
        transform-origin: center;
        will-change: transform;
      }

      /* 9. Headphone Signals */
      @keyframes heroHeadphoneSignalWave {
        0%, 100% {
          transform: scale(0.95);
          opacity: 0.6;
        }
        50% {
          transform: scale(1.14);
          opacity: 1;
        }
      }
      .hero-headphone-signals {
        animation: heroHeadphoneSignalWave 3.8s ease-in-out infinite 0.2s !important;
        transform-box: fill-box;
        transform-origin: center;
        will-change: transform;
      }

      /* 10. Glowing Sparkles & Diamonds */
      @keyframes heroSparkleTwinkle {
        0%, 100% {
          transform: translateY(0px) translateX(0px) scale(1);
          opacity: 0.45;
        }
        50% {
          transform: translateY(-4px) translateX(2px) scale(1.35);
          opacity: 1;
        }
      }
      .hero-sparkle-1 {
        animation: heroSparkleTwinkle 3.4s ease-in-out infinite 0s !important;
        transform-box: fill-box;
        transform-origin: center;
        will-change: transform;
      }
      .hero-sparkle-2 {
        animation: heroSparkleTwinkle 4.2s ease-in-out infinite 1.3s !important;
        transform-box: fill-box;
        transform-origin: center;
        will-change: transform;
      }
      .hero-sparkle-3 {
        animation: heroSparkleTwinkle 3.8s ease-in-out infinite 0.7s !important;
        transform-box: fill-box;
        transform-origin: center;
        will-change: transform;
      }
      .hero-sparkle-4 {
        animation: heroSparkleTwinkle 4.6s ease-in-out infinite 1.9s !important;
        transform-box: fill-box;
        transform-origin: center;
        will-change: transform;
      }

      /* Hero 'AxentAI Labs' High-Contrast Branding Text */
      .hero-brand-contrast {
        font-weight: 800 !important;
        color: #111111 !important;
        text-shadow: 0 1px 2px rgba(255, 255, 255, 0.95), 0 0 14px rgba(255, 255, 255, 0.85) !important;
        letter-spacing: 0.08em;
      }

      /* Hover states for interactive preview */
      .hero-ph-tile:hover {
        transform: translateY(-12px) translateX(4px) scale(1.08) rotate(0deg) !important;
      }
      .hero-x-tile:hover {
        transform: translateY(-13px) translateX(-4px) scale(1.08) rotate(0deg) !important;
      }
      .hero-li-tile:hover {
        transform: translateY(-11px) translateX(5px) scale(1.08) rotate(0deg) !important;
      }
      .hero-reddit-tile:hover {
        transform: translateY(-13px) translateX(-5px) scale(1.08) rotate(0deg) !important;
      }

      @media (prefers-reduced-motion: reduce) {
        .hero-ph-tile,
        .hero-ph-label,
        .hero-x-tile,
        .hero-x-label,
        .hero-li-tile,
        .hero-li-label,
        .hero-reddit-tile,
        .hero-reddit-label,
        .hero-mint-glow,
        .hero-mint-aura,
        .hero-wave-layer-1,
        .hero-wave-layer-2,
        .hero-dotted-line,
        .hero-growth-arrow,
        .hero-headphone-signals,
        .hero-sparkle-1,
        .hero-sparkle-2,
        .hero-sparkle-3,
        .hero-sparkle-4 {
          animation-duration: 14s !important;
        }
      }
    </style>
  </head>
  <body class="bg-white text-[#111111] font-sans antialiased overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
